<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Permissions-Policy" content="geolocation=*">
<title>圃場高低差測定</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#080d1a;--sur:#0f1724;--sur2:#172030;--bdr:#243048;
  --acc:#00d4aa;--acc2:#2288ff;--txt:#ddeaff;--txt2:#6a80a8;
  --red:#ff4040;--grn:#22cc55;--ora:#ffaa00;
  --font:"Noto Sans JP",sans-serif;--mono:"JetBrains Mono",monospace;
}
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
html,body{
  width:100%;background:var(--bg);color:var(--txt);
  font-family:var(--font);font-size:16px;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  overflow-x:hidden;
}

/* ══ トップバー ══ */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--sur);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;padding:0 32px;height:72px;gap:10px;
}
.logo{font-weight:700;font-size:16px;color:var(--acc);}
.logo span{color:var(--txt2);font-weight:400;}
.badge{font-size:22px;border:1px solid rgba(0,212,170,.35);color:var(--acc);padding:2px 12px;border-radius:4px;font-family:var(--mono);}
.conn-dot{width:8px;height:8px;border-radius:50%;background:#444;margin-left:auto;flex-shrink:0;}
.conn-dot.on{background:var(--acc);box-shadow:0 0 6px var(--acc);}
.conn-dot.ora{background:var(--ora);animation:blink .8s infinite;}
@keyframes blink{50%{opacity:.2}}

/* ══ ヒートマップ（画面いっぱい） ══ */
.map-wrap{
  position:relative;
  width:100vw;
  height:100vw;
  background:#0a0e1a;
}
#heatmap{position:absolute;top:0;left:0;display:block;}

/* 4隅ボタン */
.corner-btn{
  position:absolute;width:110px;height:110px;
  border-radius:50%;border:4px solid var(--acc);
  background:rgba(0,212,170,.35);color:var(--acc);
  font-size:18px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  text-align:center;line-height:1.4;
  -webkit-tap-highlight-color:transparent;
  transition:background .15s;
  z-index:999;
}
.corner-btn:active{background:rgba(0,212,170,.4);}
.corner-btn.done{background:rgba(0,212,170,.35);border-color:var(--grn);color:var(--grn);}
.corner-btn:disabled{opacity:.3;pointer-events:none;}
.corner-tl{top:8px;left:8px;}
.corner-tr{top:8px;right:8px;}
.corner-bl{bottom:8px;left:8px;}
.corner-br{bottom:8px;right:8px;}

/* センターマーカー */
.center-mark{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:24px;height:24px;pointer-events:none;
}

/* ステータスバー */
.status-bar{
  background:var(--sur);border-bottom:1px solid var(--bdr);
  display:flex;gap:0;overflow-x:auto;
}
.stat-item{
  flex:1;min-width:90px;padding:24px 8px;text-align:center;
  border-right:1px solid var(--bdr);
}
.stat-item:last-child{border-right:none;}
.stat-v{font-family:var(--mono);font-size:16px;font-weight:700;}
.stat-l{font-size:27px;color:var(--txt2);margin-top:3px;}

/* ══ コントロールパネル（スクロール領域） ══ */
.panel{padding:40px 32px;display:flex;flex-direction:column;gap:18px;}

/* セクション */
.sec{background:var(--sur);border-radius:15px;overflow:hidden;}
.sec-hd{
  padding:28px 32px;font-size:14px;font-weight:700;
  letter-spacing:.1em;color:var(--txt2);text-transform:uppercase;
  border-bottom:1px solid var(--bdr);background:var(--sur2);
}
.sec-body{padding:32px;display:flex;flex-direction:column;gap:14px;}

/* ボタン */
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:28px;border-radius:15px;border:1px solid var(--bdr);
  background:var(--sur2);color:var(--txt);font-family:var(--font);
  font-size:16px;cursor:pointer;transition:opacity .15s;width:100%;
}
.btn:active{opacity:.7;}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#000;font-weight:700;}
.btn.red{border-color:var(--red);color:var(--red);}
.btn.ora{background:linear-gradient(135deg,#ffaa00,#ff6600);border:none;color:#000;font-weight:700;}
.btn.grn{background:var(--grn);border-color:var(--grn);color:#000;font-weight:700;}
.btn:disabled{opacity:.3;pointer-events:none;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{flex:1;}

/* GPS情報 */
.gps-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.gps-item{background:var(--sur2);border:1px solid var(--bdr);border-radius:15px;padding:24px 28px;}
.gps-lbl{font-size:12px;color:var(--txt2);margin-bottom:4px;}
.gps-val{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--acc);}

/* ログ */
.nmea{
  background:var(--sur2);border:1px solid var(--bdr);border-radius:9px;
  padding:16px 20px;font-family:var(--mono);font-size:25px;color:var(--txt2);
  min-height:44px;white-space:pre-wrap;word-break:break-all;line-height:1.6;font-size:30px;
}

/* エリアボタン */
.area-btns{display:flex;gap:8px;}
.area-btn{
  flex:1;padding:28px 8px;border-radius:15px;border:1px solid var(--bdr);
  background:var(--sur2);color:var(--txt2);font-family:var(--font);
  font-size:17px;font-weight:700;cursor:pointer;text-align:center;
  transition:all .15s;
}
.area-btn.active{background:var(--acc);border-color:var(--acc);color:#000;}

/* 圃場リスト */
.field-list{display:flex;flex-direction:column;gap:8px;}
.fc{
  background:var(--sur2);border:1px solid var(--bdr);border-radius:15px;
  padding:32px;cursor:pointer;transition:border-color .15s;
}
.fc.active{border-color:var(--acc);}
.fc-name{font-size:17px;font-weight:700;color:var(--txt);margin-bottom:6px;}
.fc-meta{font-size:13px;color:var(--txt2);}

/* 基準点 */
.ref-box{
  background:var(--sur2);border:1px solid var(--bdr);border-radius:12px;
  padding:24px 28px;display:flex;align-items:center;gap:10px;
}
.ref-val{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--ora);flex:1;}

/* 入力 */
.input-row{display:flex;align-items:center;gap:8px;}
.input-row label{font-size:12px;color:var(--txt2);white-space:nowrap;}
input[type=number],input[type=text]{
  background:var(--sur2);border:1px solid var(--bdr);border-radius:12px;
  color:var(--txt);font-size:16px;padding:24px 28px;font-family:var(--font);
}
input[type=number]{width:72px;text-align:center;}
input[type=text]{flex:1;}
input:focus{outline:none;border-color:var(--acc);}

/* オートステータス */
.auto-status{font-size:15px;color:var(--txt2);text-align:center;padding:12px 0;}

/* モーダル */
.modal-ov{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:1000;align-items:center;justify-content:center;padding:40px;
}
.modal{
  background:var(--sur);border:1px solid var(--bdr);border-radius:18px;
  padding:40px;width:100%;max-width:360px;
}
.modal h3{font-size:16px;margin-bottom:16px;color:var(--acc);}
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:27px;color:var(--txt2);margin-bottom:4px;}
.fg input{width:100%;}
.modal-act{display:flex;gap:8px;margin-top:16px;}
.modal-act .btn{flex:1;}

/* legend */
.legend-wrap{
  display:flex;align-items:center;gap:8px;padding:0 8px;
}
.legend-bar{
  flex:1;height:10px;border-radius:7px;
  background:linear-gradient(to right,#1e64ff,#22c837,#dc2b2b);
}
.legend-labels{display:flex;justify-content:space-between;font-size:25px;margin-top:2px;}
.legend-labels span{font-family:var(--mono);}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>

<!-- トップバー -->
<div class="topbar">
  <div class="logo">田んぼ高低差 <span>SURVEY</span></div>
  <div class="badge">DG-PRO1RWS</div>
  <div class="conn-dot" id="connDot"></div>
</div>

<!-- ヒートマップ（画面いっぱい正方形） -->
<div class="map-wrap" id="mapWrap">
  <div id="leafletMap" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;"></div>
  <canvas id="heatmap" style="position:absolute;top:0;left:0;z-index:2;pointer-events:none;"></canvas>
  <button class="corner-btn corner-tl" id="cornerTL" style="z-index:999;" disabled>左上<br>記録</button>
  <button class="corner-btn corner-tr" id="cornerTR" style="z-index:999;" disabled>右上<br>記録</button>
  <button class="corner-btn corner-bl" id="cornerBL" style="z-index:999;" disabled>左下<br>記録</button>
  <button class="corner-btn corner-br" id="cornerBR" style="z-index:999;" disabled>右下<br>記録</button>
  <!-- センターマーカー -->
  <svg class="center-mark" id="centerMark" style="display:none;z-index:20;" viewBox="0 0 24 24">
    <line x1="12" y1="2" x2="12" y2="22" stroke="#ffaa00" stroke-width="2"/>
    <line x1="2" y1="12" x2="22" y2="12" stroke="#ffaa00" stroke-width="2"/>
    <circle cx="12" cy="12" r="3" fill="#ffaa00"/>
  </svg>
</div>

<!-- ステータスバー -->
<div class="status-bar" id="statusBar" style="display:none">
  <div class="stat-item"><div class="stat-v" style="color:var(--red)" id="statHi">—</div><div class="stat-l">最高(cm)</div></div>
  <div class="stat-item"><div class="stat-v" style="color:#5588ff" id="statLo">—</div><div class="stat-l">最低(cm)</div></div>
  <div class="stat-item"><div class="stat-v" style="color:var(--acc)" id="statRange">—</div><div class="stat-l">高低差(cm)</div></div>
  <div class="stat-item"><div class="stat-v" style="color:var(--txt2)" id="statPoints">—</div><div class="stat-l">測定点</div></div>
</div>

<!-- スクロール領域 -->
<div class="panel">

  <!-- GPS接続 -->
  <div class="sec">
    <div class="sec-hd">GPS接続</div>
    <div class="sec-body">
      <div class="btn-row">
        <button class="btn acc" id="btnConnect">GPS接続</button>
        <button class="btn" id="btnDisconnect" disabled>切断</button>
      </div>
      <div class="nmea" id="nmeaLog">待機中...</div>
      <div class="gps-grid">
        <div class="gps-item"><div class="gps-lbl">標高(m)</div><div class="gps-val" id="gpsAlt">—</div></div>
        <div class="gps-item"><div class="gps-lbl">精度(m)</div><div class="gps-val" id="gpsAcc">—</div></div>
        <div class="gps-item"><div class="gps-lbl">衛星数</div><div class="gps-val" id="gpsSat">—</div></div>
        <div class="gps-item"><div class="gps-lbl">Fix</div><div class="gps-val" id="gpsFix">—</div></div>
      </div>
    </div>
  </div>

  <!-- エリア選択 -->
  <div class="sec">
    <div class="sec-hd">エリア選択</div>
    <div class="sec-body">
      <div class="area-btns" id="areaBtns">
        <div class="area-btn active" onclick="switchArea('白根')">白根</div>
        <div class="area-btn" onclick="switchArea('潟東')">潟東</div>
        <div class="area-btn" onclick="switchArea('金巻')">金巻</div>
      </div>
    </div>
  </div>

  <!-- 圃場管理 -->
  <div class="sec">
    <div class="sec-hd">圃場 <span id="fieldCount" style="color:var(--acc)">0</span>枚</div>
    <div class="sec-body">
      <div class="input-row">
        <label>X</label>
        <input type="number" id="gridX" value="5" min="1" max="30">
        <label>Y</label>
        <input type="number" id="gridY" value="4" min="1" max="30">
        <button class="btn acc" id="btnNewField" style="flex:1">＋新規作成</button>
      </div>
      <div class="field-list" id="fieldList">
        <div style="font-size:12px;color:var(--txt2);padding:4px">圃場がありません</div>
      </div>
    </div>
  </div>

  <!-- 選択中圃場の測定（圃場選択後に表示） -->
  <div class="sec" id="measureSec" style="display:none">
    <div class="sec-hd" id="mainTitle">圃場名</div>
    <div class="sec-body">
      <!-- 基準点 -->
      <div class="ref-box">
        <div style="font-size:11px;color:var(--txt2);line-height:1.4">センター<br>基準高度</div>
        <div class="ref-val" id="centerAltDisplay">未記録</div>
        <button class="btn red" id="btnResetCenter" style="width:auto;padding:6px 10px;font-size:11px">リセット</button>
      </div>
      <button class="btn ora" id="btnMeasure" disabled>🎯 ここを基準点に設定</button>
      <div class="auto-status" id="autoRecordStatus">4隅のどれかを押すと記録開始</div>
      <button class="btn" id="btnToggleSelf" style="margin-top:4px;">自機位置 表示中</button>
      <!-- legend -->
      <div>
        <div class="legend-wrap">
          <span style="font-size:10px;color:var(--txt2)">低</span>
          <div class="legend-bar"></div>
          <span style="font-size:10px;color:var(--txt2)">高</span>
        </div>
        <div class="legend-labels" id="legendLabels" style="display:none">
          <span id="legLo" style="color:#5588ff">—</span>
          <span style="color:var(--grn)">基準 0</span>
          <span id="legHi" style="color:var(--red)">—</span>
        </div>
      </div>
      <!-- 測定終了 -->
      <button class="btn red" id="btnEndMeasure" style="margin-top:4px">■ 測定終了（圃場選択に戻る）</button>
    </div>
  </div>

</div>

<!-- モーダル -->
<div class="modal-ov" id="modalOverlay">
  <div class="modal">
    <h3>新規圃場を作成</h3>
    <div class="fg"><label>圃場名</label><input type="text" id="fieldNameInput" placeholder="例: 第1圃場"></div>
    <div class="fg"><label>メモ（任意）</label><input type="text" id="fieldNoteInput" placeholder="例: 北側 30a"></div>
    <div class="modal-act">
      <button class="btn" id="btnModalCancel">キャンセル</button>
      <button class="btn acc" id="btnModalCreate">作成</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ════════════════════════════════════════════
//  DB
// ════════════════════════════════════════════
const AREAS = ['白根', '潟東', '金巻'];
let showSelfMarker = true;
let selfMarker = { lat:null, lon:null, alt:null };
let currentArea = AREAS[0];
let db = { '白根':{fields:[]}, '潟東':{fields:[]}, '金巻':{fields:[]} };

function loadDB() {
  try {
    const saved = JSON.parse(localStorage.getItem('paddyDB_v2') || 'null');
    if (saved && saved['白根']) {
      db = saved;
    } else {
      const old = JSON.parse(localStorage.getItem('paddyDB') || '{"fields":[]}');
      db['白根'].fields = old.fields || [];
    }
  } catch(e) { db = { '白根':{fields:[]}, '潟東':{fields:[]}, '金巻':{fields:[]} }; }
}
function saveDB() {
  try { localStorage.setItem('paddyDB_v2', JSON.stringify(db)); } catch(e) {}
}
function areaFields() { return db[currentArea].fields; }
loadDB();

// ════════════════════════════════════════════
//  GPS
// ════════════════════════════════════════════
let geoWatchId = null;
let gpsData = { lat:null, lon:null, alt:null, accuracy:null };

document.getElementById('btnConnect').onclick = () => {
  if (!navigator.geolocation) { alert('Geolocation未対応です'); return; }
  if (location.protocol === 'file:') {
    logNMEA('⚠ file://では動きません。\nGitHub Pages経由で開いてください。');
    return;
  }
  logNMEA('GPS接続中...');
  geoWatchId = navigator.geolocation.watchPosition(
    pos => {
      gpsData.lat      = pos.coords.latitude;
      gpsData.lon      = pos.coords.longitude;
      gpsData.alt      = pos.coords.altitude;
      gpsData.accuracy = pos.coords.accuracy;
      setConnected(true);
      const alt = gpsData.alt      != null ? gpsData.alt.toFixed(3)+'m'      : '--';
      const acc = gpsData.accuracy != null ? gpsData.accuracy.toFixed(3)+'m' : '--';
      logNMEA('lat:'+gpsData.lat.toFixed(7)+'\nalt:'+alt+' acc:'+acc);
      document.getElementById('gpsAlt').textContent = gpsData.alt      != null ? gpsData.alt.toFixed(3)      : '—';
      document.getElementById('gpsAcc').textContent = gpsData.accuracy != null ? gpsData.accuracy.toFixed(3) : '—';
      document.getElementById('gpsSat').textContent = '—';
      const isRTK = gpsData.accuracy != null && gpsData.accuracy < 0.1;
      document.getElementById('gpsFix').textContent = isRTK ? 'RTK' : 'GPS';
      document.getElementById('gpsFix').style.color  = isRTK ? '#00ff88' : '#ffaa00';
      updateMapPosition(gpsData.lat, gpsData.lon);
      selfMarker.lat = gpsData.lat;
      selfMarker.lon = gpsData.lon;
      selfMarker.alt = gpsData.alt;
      tryAutoRecord();
      if (currentField) drawHeatmap();
    },
    err => {
      let msg = '';
      if (err.code === 1) { msg = '位置情報の許可が必要です'; alert(msg); }
      else if (err.code === 2) msg = 'GPS信号なし。\nDrogger-GPSの接続を確認。';
      else if (err.code === 3) msg = 'タイムアウト。\n屋外で試してください。';
      else msg = 'エラー: ' + err.message;
      logNMEA(msg); setConnected(false);
    },
    { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
  );
};

document.getElementById('btnDisconnect').onclick = () => {
  if (geoWatchId != null) { navigator.geolocation.clearWatch(geoWatchId); geoWatchId = null; }
  setConnected(false); logNMEA('切断しました');
  selfMarker = { lat:null, lon:null, alt:null };
};

function setConnected(v) {
  document.getElementById('connDot').className = 'conn-dot' + (v ? ' on' : '');
  document.getElementById('btnConnect').disabled    = v;
  document.getElementById('btnDisconnect').disabled = !v;
  document.getElementById('btnMeasure').disabled    = !v;
  ['cornerTL','cornerTR','cornerBL','cornerBR'].forEach(id => {
    document.getElementById(id).disabled = !v || !currentField;
  });
  // GPS接続時に圃場が選択されていれば4隅を有効化
  if (v && currentField) updateCornerBtns();

}

function logNMEA(msg) {
  const el = document.getElementById('nmeaLog');
  if (el) el.textContent = msg;
}

// ════════════════════════════════════════════
//  エリア切替
// ════════════════════════════════════════════
function switchArea(area) {
  currentArea = area;
  currentField = null;
  renderFieldList();
  drawHeatmap();
  document.getElementById('mainTitle').textContent = '圃場を選択してください';
  document.getElementById('centerAltDisplay').textContent = '未記録';
  document.getElementById('centerAltDisplay').style.color = '#ffaa00';
  document.getElementById('statusBar').style.display = 'none';
  document.getElementById('centerMark').style.display = 'none';
  document.getElementById('measureSec').style.display = 'none';
  AREAS.forEach(a => {
    const btns = document.querySelectorAll('.area-btn');
    btns.forEach(b => { b.className = 'area-btn' + (b.textContent === currentArea ? ' active' : ''); });
  });
}

// ════════════════════════════════════════════
//  圃場管理
// ════════════════════════════════════════════
let currentField = null;

document.getElementById('btnNewField').onclick = () => {
  document.getElementById('modalOverlay').style.display = 'flex';
  document.getElementById('fieldNameInput').value = '';
  document.getElementById('fieldNoteInput').value = '';
  setTimeout(() => document.getElementById('fieldNameInput').focus(), 100);
};
document.getElementById('btnModalCancel').onclick = () => {
  document.getElementById('modalOverlay').style.display = 'none';
};
document.getElementById('btnModalCreate').onclick = () => {
  const name = document.getElementById('fieldNameInput').value.trim();
  if (!name) { alert('圃場名を入力してください'); return; }
  const gx = Math.max(1, Math.min(30, parseInt(document.getElementById('gridX').value) || 5));
  const gy = Math.max(1, Math.min(30, parseInt(document.getElementById('gridY').value) || 4));
  const field = {
    id: Date.now(),
    name, note: document.getElementById('fieldNoteInput').value.trim(),
    gridX:gx, gridY:gy, centerAlt:null, points:[],
    corners: { tl:null, tr:null, bl:null, br:null },
    created: new Date().toLocaleDateString('ja-JP')
  };
  areaFields().push(field);
  saveDB();
  document.getElementById('modalOverlay').style.display = 'none';
  renderFieldList();
  selectField(field.id);
};

function renderFieldList() {
  const list = document.getElementById('fieldList');
  document.getElementById('fieldCount').textContent = areaFields().length;
  if (!areaFields().length) {
    list.innerHTML = '<div style="font-size:12px;color:var(--txt2);padding:4px">圃場がありません</div>';
    return;
  }
  list.innerHTML = areaFields().map(f => {
    const pts = (f.points||[]).length;
    const active = currentField && currentField.id === f.id;
    const corners = f.corners || {};
    const cornersStr = ['tl','tr','bl','br'].map(k => corners[k] ? '●' : '○').join('');
    return `<div class="fc${active?' active':''}" data-id="${f.id}">
      <div class="fc-name">${f.name}${f.note?' <span style="font-weight:400;font-size:11px;color:var(--txt2)">'+f.note+'</span>':''}</div>
      <div class="fc-meta">${f.created||''} / ${pts}点 / 4隅:${cornersStr}</div>
      ${f.centerAlt!=null?'<div class="fc-meta" style="color:var(--acc)">基準:'+f.centerAlt.toFixed(3)+'m</div>':''}
      <button class="btn red" data-del="${f.id}" style="margin-top:6px;padding:5px 10px;font-size:11px">削除</button>
    </div>`;
  }).join('');
  list.querySelectorAll('.fc').forEach(card => {
    card.addEventListener('click', e => { if (e.target.dataset.del) return; selectField(parseInt(card.dataset.id)); });
  });
  list.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (!confirm('削除しますか？')) return;
      db[currentArea].fields = areaFields().filter(f => f.id !== parseInt(btn.dataset.del));
      saveDB();
      if (currentField && currentField.id === parseInt(btn.dataset.del)) {
        currentField = null;
        drawHeatmap();
        document.getElementById('statusBar').style.display = 'none';
        document.getElementById('centerMark').style.display = 'none';
      }
      renderFieldList();
    });
  });
}

function selectField(id) {
  autoRecording = false;
  currentField = areaFields().find(f => f.id === id);
  if (!currentField) return;
  if (!currentField.corners) currentField.corners = {tl:null,tr:null,bl:null,br:null};
  renderFieldList();
  document.getElementById('mainTitle').textContent = currentField.name + (currentField.note ? ' — '+currentField.note : '');
  document.getElementById('measureSec').style.display = 'block';
  document.getElementById('btnMeasure').disabled = gpsData.alt == null;
  // 圃場選択時に4隅ボタンを有効化（GPS接続前でも表示）
  ['cornerTL','cornerTR','cornerBL','cornerBR'].forEach(id => {
    document.getElementById(id).disabled = false;
  });
  updateMeasureLabel();
  updateCornerBtns();
  drawHeatmap();
  const status = document.getElementById('autoRecordStatus');
  if (currentField.centerAlt != null) {
    status.textContent = autoRecording ? '🟢 記録中' : '4隅のどれかを押すと記録開始';
    status.style.color = autoRecording ? 'var(--acc)' : 'var(--ora)';
  } else {
    status.textContent = '基準点を設定してください';
    status.style.color = 'var(--txt2)';
  }
  // 測定セクションまでスクロール
  setTimeout(() => document.getElementById('measureSec').scrollIntoView({behavior:'smooth', block:'start'}), 150);
}

// ════════════════════════════════════════════
//  4隅記録
// ════════════════════════════════════════════
function updateCornerBtns() {
  const corners = currentField ? (currentField.corners || {}) : {};
  const connected = !document.getElementById('btnConnect').disabled === false;
  ['tl','tr','bl','br'].forEach((k,i) => {
    const ids = ['cornerTL','cornerTR','cornerBL','cornerBR'];
    const btn = document.getElementById(ids[i]);
    const labels = ['左上','右上','左下','右下'];
    btn.className = 'corner-btn corner-'+['tl','tr','bl','br'][i] + (corners[k] ? ' done' : '');
    btn.innerHTML = labels[i]+'<br>'+(corners[k] ? '✓' : '記録');
    btn.disabled = !currentField;
  });
}

['TL','TR','BL','BR'].forEach(pos => {
  document.getElementById('corner'+pos).onclick = () => {
    if (!currentField) { alert('圃場を選択してください'); return; }
    if (gpsData.alt == null) { alert('GPS接続してから4隅を記録してください'); return; }
    if (!currentField.corners) currentField.corners = {tl:null,tr:null,bl:null,br:null};
    const key = pos.toLowerCase();
    currentField.corners[key] = { alt:gpsData.alt, lat:gpsData.lat, lon:gpsData.lon };
    // 4隅のどれかを最初に押した時点で記録開始
    if (!autoRecording) {
      autoRecording = true;
      const status = document.getElementById('autoRecordStatus');
      if (status) { status.textContent = '🟢 記録中 — 走行してください'; status.style.color = 'var(--acc)'; }
    }
    saveDB(); updateCornerBtns(); renderFieldList(); drawHeatmap();
  };
});

// ════════════════════════════════════════════
//  基準点 & 自動記録
// ════════════════════════════════════════════
let autoRecording = false;
let lastAutoRecordTime = 0;

document.getElementById('btnMeasure').onclick = () => {
  if (!currentField) { alert('圃場を選択してください'); return; }
  if (gpsData.alt == null) { alert('GPS高度データがありません'); return; }
  currentField.centerAlt = gpsData.alt;
  currentField.points    = [];
  autoRecording = false;
  saveDB(); drawHeatmap(); renderFieldList(); updateMeasureLabel(); updateCornerBtns();
  document.getElementById('centerMark').style.display = 'block';
  const status = document.getElementById('autoRecordStatus');
  status.textContent = '4隅のどれかを押すと記録開始';
  status.style.color = 'var(--ora)';
};

document.getElementById('btnResetCenter').onclick = () => {
  if (!currentField) return;
  if (!confirm('基準点をリセットしますか？\n測定データも消えます。')) return;
  currentField.centerAlt    = null;
  currentField.points       = [];
  currentField.corners      = {tl:null, tr:null, bl:null, br:null};
  autoRecording             = false;
  saveDB(); drawHeatmap(); renderFieldList(); updateMeasureLabel(); updateCornerBtns();
  document.getElementById('centerMark').style.display = 'none';
  document.getElementById('statusBar').style.display  = 'none';

};

function updateMeasureLabel() {
  const btn = document.getElementById('btnMeasure');
  const el  = document.getElementById('centerAltDisplay');
  if (!currentField) return;
  if (currentField.centerAlt == null) {
    btn.textContent = '🎯 ここを基準点に設定';
    btn.className   = 'btn ora';
    if (el) { el.textContent = '未記録'; el.style.color = '#ffaa00'; }
  } else {
    btn.textContent = '🔄 基準点を再設定';
    btn.className   = 'btn';
    if (el) { el.textContent = currentField.centerAlt.toFixed(4)+' m'; el.style.color = '#22c850'; }
  }
}

function tryAutoRecord() {
  if (!autoRecording || !currentField || currentField.centerAlt == null) return;
  if (gpsData.lat == null || gpsData.alt == null) return;
  const now = Date.now();
  if (now - lastAutoRecordTime < 2000) return;
  lastAutoRecordTime = now;
  currentField.points.push({ alt:gpsData.alt, lat:gpsData.lat, lon:gpsData.lon });
  saveDB(); drawHeatmap(); renderFieldList();
  const status = document.getElementById('autoRecordStatus');
  if (status) { status.textContent = '🟢 記録中 '+currentField.points.length+'点'; status.style.color = 'var(--acc)'; }
}

// ════════════════════════════════════════════
//  ヒートマップ（縦画面正方形）
// ════════════════════════════════════════════
const canvas = document.getElementById('heatmap');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  const size = window.innerWidth;
  canvas.width  = size;
  canvas.height = size;
  canvas.style.width  = size+'px';
  canvas.style.height = size+'px';
  document.getElementById('mapWrap').style.height = size+'px';
}
window.addEventListener('resize', () => { resizeCanvas(); drawHeatmap(); });
window.addEventListener('orientationchange', () => { setTimeout(()=>{ resizeCanvas(); drawHeatmap(); }, 300); });
resizeCanvas();

function idw(known, px, py) {
  let num=0, den=0;
  for (const k of known) {
    const d = Math.sqrt((k.px-px)**2+(k.py-py)**2);
    if (d < 0.001) return k.alt;
    const w = 1/d**2; num+=w*k.alt; den+=w;
  }
  return den===0 ? known[0].alt : num/den;
}

function altColor(t) {
  t = Math.max(0, Math.min(1, t));
  if (t < 0.5) { const s=t*2; return [Math.round(30+s*4), Math.round(100+s*100), Math.round(255-s*195)]; }
  const s=(t-0.5)*2; return [Math.round(34+s*186), Math.round(200-s*160), Math.round(60-s*20)];
}

function drawHeatmap() {
  resizeCanvas();
  const W = canvas.width;
  const H = W;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a0e1a'; ctx.fillRect(0,0,W,H);

  if (!currentField) {
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='15px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('圃場を選択してください',W/2,H/2); return;
  }
  if (currentField.centerAlt==null) {
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='15px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('基準点を設定してください',W/2,H/2);
    document.getElementById('statusBar').style.display='none'; return;
  }
  const pts = currentField.points||[];
  if (pts.length===0) {
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='15px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('4隅を押して走行開始してください',W/2,H/2);
    document.getElementById('statusBar').style.display='none'; return;
  }

  const altCenter = currentField.centerAlt;
  const cr2 = currentField.corners||{};
  const pad = 20;
  const plotW = W-pad*2, plotH = H-pad*2;

  // canvas上の4隅の座標（固定）
  const canvCorners = {
    tl:[pad,       pad      ],
    tr:[pad+plotW, pad      ],
    bl:[pad,       pad+plotH],
    br:[pad+plotW, pad+plotH],
  };

  const hasTL = cr2.tl&&cr2.tl.lat!=null;
  const hasTR = cr2.tr&&cr2.tr.lat!=null;
  const hasBL = cr2.bl&&cr2.bl.lat!=null;
  const hasBR = cr2.br&&cr2.br.lat!=null;

  // GPS→canvas座標変換（4隅基準の双線形補間）
  function latLonToCanvas(lat, lon) {
    // 4隅のGPS座標→canvas座標の対応から双線形補間
    // 左上ボタン押した場所=canvas左上、右上=canvas右上、左下=canvas左下、右下=canvas右下
    // この対応は絶対に変わらない
    const cpMap = {
      tl:[pad,      pad      ],
      tr:[pad+plotW,pad      ],
      bl:[pad,      pad+plotH],
      br:[pad+plotW,pad+plotH],
    };

    if (hasTL && hasTR && hasBL && hasBR) {
      // 4隅全部ある: 双線形補間
      // GPS座標の4隅を使ってX方向とY方向を独立に補間
      // 上辺(TL→TR)でのX位置
      const topDLon = cr2.tr.lon - cr2.tl.lon;
      const topDLat = cr2.tr.lat - cr2.tl.lat;
      const topLen = Math.sqrt(topDLon*topDLon + topDLat*topDLat) || 0.000001;
      // 下辺(BL→BR)でのX位置
      const botDLon = cr2.br.lon - cr2.bl.lon;
      const botDLat = cr2.br.lat - cr2.bl.lat;
      const botLen = Math.sqrt(botDLon*botDLon + botDLat*botDLat) || 0.000001;
      // 左辺(TL→BL)でのY位置
      const lftDLon = cr2.bl.lon - cr2.tl.lon;
      const lftDLat = cr2.bl.lat - cr2.tl.lat;
      const lftLen = Math.sqrt(lftDLon*lftDLon + lftDLat*lftDLat) || 0.000001;
      // 右辺(TR→BR)でのY位置
      const rgtDLon = cr2.br.lon - cr2.tr.lon;
      const rgtDLat = cr2.br.lat - cr2.tr.lat;
      const rgtLen = Math.sqrt(rgtDLon*rgtDLon + rgtDLat*rgtDLat) || 0.000001;

      // 上辺上でのTLからの距離比率→tx_top
      const dTopLon = lon - cr2.tl.lon;
      const dTopLat = lat - cr2.tl.lat;
      const tx_top = Math.max(0,Math.min(1,(dTopLon*topDLon + dTopLat*topDLat) / (topLen*topLen)));

      // 下辺上でのBLからの距離比率→tx_bot
      const dBotLon = lon - cr2.bl.lon;
      const dBotLat = lat - cr2.bl.lat;
      const tx_bot = Math.max(0,Math.min(1,(dBotLon*botDLon + dBotLat*botDLat) / (botLen*botLen)));

      // 左辺上でのTLからの距離比率→ty_lft
      const dLftLon = lon - cr2.tl.lon;
      const dLftLat = lat - cr2.tl.lat;
      const ty_lft = Math.max(0,Math.min(1,(dLftLon*lftDLon + dLftLat*lftDLat) / (lftLen*lftLen)));

      // 右辺上でのTRからの距離比率→ty_rgt
      const dRgtLon = lon - cr2.tr.lon;
      const dRgtLat = lat - cr2.tr.lat;
      const ty_rgt = Math.max(0,Math.min(1,(dRgtLon*rgtDLon + dRgtLat*rgtDLat) / (rgtLen*rgtLen)));

      // ty_lftとty_rgtの平均でY方向の位置を決める
      const ty = (ty_lft + ty_rgt) / 2;
      // tx_topとtx_botの平均でX方向の位置を決める
      const tx = (tx_top + tx_bot) / 2;

      return [pad + tx*plotW, pad + ty*plotH];
    }

    // 4隅なし: 走行点の範囲でスケーリング
    const allLats = pts.map(p=>p.lat).filter(v=>v!=null);
    const allLons = pts.map(p=>p.lon).filter(v=>v!=null);
    if (allLats.length < 2) return [W/2, H/2];
    const laMax2 = Math.max(...allLats), laMin2 = Math.min(...allLats);
    const loMin2 = Math.min(...allLons), loMax2 = Math.max(...allLons);
    return [
      pad + ((lon-loMin2) / Math.max(loMax2-loMin2, 0.000001)) * plotW,
      pad + ((laMax2-lat) / Math.max(laMax2-laMin2, 0.000001)) * plotH
    ];
  }

  // 走行点をcanvas座標に変換（色の計算に使う）
  const known = pts.filter(p=>p.lat!=null).map(p=>{
    const [px,py] = latLonToCanvas(p.lat, p.lon);
    return {px, py, alt: p.alt};
  });

  // 4隅も補間に追加
  ['tl','tr','bl','br'].forEach(k=>{
    if (cr2[k] && cr2[k].lat!=null) {
      known.push({px: canvCorners[k][0], py: canvCorners[k][1], alt: cr2[k].alt});
    }
  });

  if (known.length < 2) {
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='13px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('データ不足',W/2,H/2); return;
  }

  // 統計: 走行点のみで計算（4隅は含めない）
  const ptAlts = pts.map(p=>p.alt);
  const altMax = Math.max(...ptAlts);
  const altMin2 = Math.min(...ptAlts);
  const maxDev = Math.max(Math.abs(altMax-altCenter), Math.abs(altMin2-altCenter), 0.001);
  const spread = maxDev * 2;

  document.getElementById('statusBar').style.display='flex';
  const hiCm=(altMax-altCenter)*100, loCm=(altMin2-altCenter)*100;
  document.getElementById('statHi').textContent    = (hiCm>=0?'+':'')+hiCm.toFixed(1);
  document.getElementById('statLo').textContent    = (loCm>=0?'+':'')+loCm.toFixed(1);
  document.getElementById('statRange').textContent = ((altMax-altMin2)*100).toFixed(1);
  document.getElementById('statPoints').textContent = pts.length+'点';
  document.getElementById('legHi').textContent = (hiCm>=0?'+':'')+hiCm.toFixed(1)+' cm';
  document.getElementById('legLo').textContent = (loCm>=0?'+':'')+loCm.toFixed(1)+' cm';
  document.getElementById('legendLabels').style.display='flex';

  // IDW補間してヒートマップ描画
  const res=4, cols=Math.ceil(plotW/res), rows2=Math.ceil(plotH/res);
  const imgData = ctx.createImageData(cols*res, rows2*res);
  for (let r=0; r<rows2; r++) for (let cc=0; cc<cols; cc++) {
    const x = pad+cc*res, y = pad+r*res;
    const v = known.length===1 ? known[0].alt : idw(known, x, y);
    const norm = Math.max(0, Math.min(1, 0.5+(v-altCenter)/spread));
    const [cr,cg,cb] = altColor(norm);
    for (let dy=0; dy<res; dy++) for (let dx=0; dx<res; dx++) {
      const idx = ((r*res+dy)*(cols*res)+cc*res+dx)*4;
      imgData.data[idx]=cr; imgData.data[idx+1]=cg; imgData.data[idx+2]=cb; imgData.data[idx+3]=220;
    }
  }
  const oc = new OffscreenCanvas(cols*res, rows2*res);
  oc.getContext('2d').putImageData(imgData, 0, 0);
  ctx.drawImage(oc, pad, pad, plotW, plotH);

  // 枠線
  ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1;
  ctx.strokeRect(pad, pad, plotW, plotH);

  // 4隅マーカー（緑の丸）
  ['tl','tr','bl','br'].forEach(k=>{
    if (!cr2[k]) return;
    const [x,y] = canvCorners[k];
    ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2);
    ctx.fillStyle='#00ff88'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
  });

  // 自機マーカー
  if (showSelfMarker && selfMarker && selfMarker.lat!=null) {
    const [mx,my] = latLonToCanvas(selfMarker.lat, selfMarker.lon);
    if (mx>=pad && mx<=pad+plotW && my>=pad && my<=pad+plotH) {
      ctx.beginPath(); ctx.arc(mx,my,12,0,Math.PI*2);
      ctx.fillStyle='#00d4aa'; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('自',mx,my);
    }
  }

  // 地図オーバーレイ
  setTimeout(overlayHeatmapOnMap, 0);
}


function initMap(lat, lon) {
  if (leafletMap) return;
  const mapEl = document.getElementById('leafletMap');
  leafletMap = L.map(mapEl, {
    center: [lat || 37.5, lon || 138.9],
    zoom: 17,
    zoomControl: true,
    attributionControl: false
  });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 20
  }).addTo(leafletMap);
  // 現在地マーカー
  currentMarker = L.circleMarker([lat||37.5, lon||138.9], {
    radius: 8, color:'#00d4aa', fillColor:'#00d4aa',
    fillOpacity:1, weight:2
  }).addTo(leafletMap);
}

function updateMapPosition(lat, lon) {
  if (!leafletMap) { initMap(lat, lon); return; }
  if (currentMarker) currentMarker.setLatLng([lat, lon]);
  leafletMap.setView([lat, lon], leafletMap.getZoom());
}

// ヒートマップcanvasを地図に重ねる
function overlayHeatmapOnMap() {
  if (!leafletMap || !currentField) return;
  const pts = (currentField.points||[]);
  const corners2 = currentField.corners||{};
  const allLats = [...pts.filter(p=>p.lat!=null).map(p=>p.lat)];
  const allLons = [...pts.filter(p=>p.lon!=null).map(p=>p.lon)];
  ['tl','tr','bl','br'].forEach(k=>{ if(corners2[k]){allLats.push(corners2[k].lat);allLons.push(corners2[k].lon);} });
  if (allLats.length < 2) return;
  const latMax=Math.max(...allLats),latMin=Math.min(...allLats);
  const lonMin=Math.min(...allLons),lonMax=Math.max(...allLons);
  // canvasをLeafletのImageOverlayとして表示
  if (heatOverlay) leafletMap.removeLayer(heatOverlay);
  const bounds = [[latMin, lonMin],[latMax, lonMax]];
  heatOverlay = L.imageOverlay(canvas.toDataURL(), bounds, {opacity:0.7}).addTo(leafletMap);
  leafletMap.fitBounds(bounds, {padding:[20,20]});
}

// ════════════════════════════════════════════
//  自機位置 表示/非表示
// ════════════════════════════════════════════

const _toggleSelfBtn = document.getElementById('btnToggleSelf');
if (_toggleSelfBtn) _toggleSelfBtn.onclick = () => {
  showSelfMarker = !showSelfMarker;
  const btn = document.getElementById('btnToggleSelf');
  btn.textContent = '自機位置 ' + (showSelfMarker ? '表示中' : '非表示');
  btn.style.color = showSelfMarker ? 'var(--acc)' : 'var(--txt2)';
  btn.style.borderColor = showSelfMarker ? 'var(--acc)' : 'var(--bdr)';
  drawHeatmap();
};

document.getElementById('btnEndMeasure').onclick = () => {
  autoRecording = false;
  currentField = null;
  document.getElementById('measureSec').style.display = 'none';
  document.getElementById('statusBar').style.display  = 'none';
  document.getElementById('centerMark').style.display = 'none';
  selfMarker = { lat:null, lon:null, alt:null };
  drawHeatmap();
  renderFieldList();
  setTimeout(() => document.getElementById('fieldList').scrollIntoView({behavior:'smooth',block:'start'}), 150);
};

//  初期化

renderFieldList();
if (areaFields().length > 0) selectField(areaFields()[0].id);
