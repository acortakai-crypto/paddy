<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--left-w:200px;--right-w:220px;}
html,body{width:100%;height:100%;overflow:hidden;background:#080d1a;}
.app{
  display:grid;
  grid-template-columns:var(--left-w) 1fr var(--right-w);
  grid-template-rows:36px 1fr;
  width:100vw;height:100vh;overflow:hidden;
}
.topbar{grid-column:1/-1;background:#0f1724;border-bottom:1px solid #243048;display:flex;align-items:center;padding:0 10px;color:#fff;font-size:12px;}
.left{background:#0f1724;border-right:1px solid #243048;overflow-y:scroll;}
.right{background:#0f1724;border-left:1px solid #243048;overflow-y:scroll;}
.center{background:#000;position:relative;}
canvas{display:block;}
#info{position:absolute;top:4px;left:4px;color:#fff;font-size:10px;background:rgba(0,0,0,.7);padding:4px;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">テスト</div>
  <div class="left"><div style="height:600px;color:#fff;font-size:10px;padding:8px">左パネル(スクロールテスト)</div></div>
  <div class="center" id="center">
    <canvas id="cv"></canvas>
    <div id="info"></div>
  </div>
  <div class="right"><div style="height:600px;color:#fff;font-size:10px;padding:8px">右パネル(スクロールテスト)</div></div>
</div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const info = document.getElementById('info');

function draw(){
  // windowベースで計算
  const leftW = 200, rightW = 220, topH = 36;
  const W = window.innerWidth  - leftW - rightW;
  const H = window.innerHeight - topH;
  cv.width  = Math.max(W, 100);
  cv.height = Math.max(H, 100);

  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#111';
  ctx.fillRect(0,0,cv.width,cv.height);

  // 5x5グリッド描画
  const gx=5,gy=5;
  const maxDotR = Math.min(Math.floor(W/(gx*2+2)),Math.floor(H/(gy*2+2)),10);
  const dr = Math.max(maxDotR,4);
  const padX=dr+14, padY=dr+14;
  const plotW=W-padX*2, plotH=H-padY*2;

  // 全格子点
  for(let r=0;r<gy;r++) for(let c=0;c<gx;c++){
    const px=padX+(c/(gx-1))*plotW;
    const py=padY+(r/(gy-1))*plotH;
    ctx.beginPath();ctx.arc(px,py,dr,0,Math.PI*2);
    ctx.fillStyle='#00d4aa';ctx.fill();
    ctx.fillStyle='#000';
    ctx.font=`bold ${Math.max(7,dr-2)}px monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(`${r+1},${c+1}`,px,py);
  }

  info.textContent = `window:${window.innerWidth}x${window.innerHeight} canvas:${W}x${H} dr:${dr} pad:${padX}/${padY}`;
}

draw();
window.addEventListener('resize', draw);
</script>
</body>
</html>
